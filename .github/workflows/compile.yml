name: Compile Arduino Sketch
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Arduino sketch code'
        required: true
        type: string
      callback_id:
        description: 'Unique ID for this compile job'
        required: true
        type: string
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Cache arduino-cli and ESP32 core
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: |
            ~/.arduino15
            /usr/local/bin/arduino-cli
          key: arduino-esp32-${{ runner.os }}-v1

      - name: Install arduino-cli (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          if ! command -v arduino-cli &> /dev/null; then
            curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          fi

      - name: Install ESP32 core and libraries (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit SSD1306" "Adafruit GFX Library" "Adafruit ADS1X15" "Adafruit BusIO"

      - name: Write sketch
        run: |
          mkdir -p /tmp/sketch
          cat << 'SKETCHEOF' > /tmp/sketch/sketch.ino
          ${{ github.event.inputs.code }}
          SKETCHEOF

      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --output-dir /tmp/output /tmp/sketch

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.inputs.callback_id }}
          path: /tmp/output/*.bin
          retention-days: 1
